name: AHM Studio tests

on:
  push:
    branches:
      - feature/ahm-autonomous-generation-foundation
      - feature/ahm-director-v2-quality
  pull_request:
    branches:
      - main
      - feature/ahm-autonomous-generation-foundation

concurrency:
  group: ahm-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --check server.js
      - run: node --check public/app.js
      - run: node --check lib/providers/llm.js
      - run: node --check lib/providers/video.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile worker/handler.py
      - run: python -m unittest discover -s test -p "test_worker.py"

      - run: docker build -t ahm-studio-worker ./worker
      - run: docker run --rm -v "$PWD/test:/tests:ro" --entrypoint python ahm-studio-worker /tests/worker_ffmpeg_smoke.py
