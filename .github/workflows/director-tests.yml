name: AHM Studio tests

on:
  push:
    branches:
      - feature/ahm-autonomous-generation-foundation
      - feature/ahm-director-v2-quality
  pull_request:
    branches:
      - main
      - feature/ahm-autonomous-generation-foundation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
